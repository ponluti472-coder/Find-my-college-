const sub=isUni?`Введите сумму баллов ЕГЭ и выберите профессию. Покажем ${kw.action} Петербурга, куда вы проходите.`:`Введите средний балл аттестата и выберите профессию. Покажем ${kw.action} Петербурга, куда вы проходите.`;
const curVarName=isUni?'S.scoreU':'S.scoreC';
const curVal=curS!==null?(isUni?curS:f(curS)):'';
h=`<div class="swTabs"><button class="${S.kind==='college'?'on':''}" onclick="setKind('college')">🎓 Колледж</button><button class="${S.kind==='uni'?'on':''}" onclick="setKind('uni')">🏛 Университет</button></div><h1>Куда поступить после ${kw.afterGrade} класса?</h1><p class="sub">${sub}</p>${examToggle}<div class="sb"><label for="sc">${label}</label><input id="sc" inputmode="${inputmode}" placeholder="${placeholder}" autocomplete="off" value="${curVal}" oninput="chk(this.value)" onkeydown="if(event.key==='Enter'&&${curVarName}!==null)go('prof')"><div id="hint" class="hint">${hintDefault}</div><label for="hm" style="display:block;margin-top:14px;font-size:13px;color:var(--mu)">Ближайшее к дому метро</label><select id="hm" class="sel" onchange="S.home=this.value">${Object.keys(H).map(k=>`<option${k===S.home?' selected':''}>${k}</option>`).join('')}</select></div><button id="go" class="btn" ${curS===null?'disabled':''} onclick="go('prof')">Выбрать профессию</button><div style="height:14px"></div>`+disclaimer}
else if(S.v==='prof'){const kw=KW(),isUni=S.kind==='uni',curS=curScore();const scoreLine=isUni?`Ваши баллы: <b>${curS}</b> из ${S.examN*100}.`:`Ваш средний балл: <b>${f(curS)}</b>.`;h=hdr()+`<h1>Кем хотите стать?</h1><p class="sub">${scoreLine} Выберите профессию, чтобы увидеть ${kw.action}.</p><div class="grid">${P.map((p,i)=>{const total=curO().filter(o=>o[0]===i).length,n=curO().filter((o,k)=>o[0]===i&&!fa().includes(k)).length,m=curO().filter((o,k)=>o[0]===i&&reach(o)&&!fa().includes(k)).length;const stat=total===0?'Пока нет в базе':(n?kw.cap+': '+n+(m?' · проходите: '+m:''):'✓ Всё добавлено');return `<div class="pc" role="button" tabindex="0" style="background:linear-gradient(135deg,${p.g})" onclick="pick(${i})"><span class="inf" onclick="event.stopPropagation();selP(${i})" aria-label="О профессии">ℹ️</span><div class="e">${p.e}</div><b>${p.n}</b><span>${p.d}</span><em>${stat}</em></div>`}).join('')}</div>`+info()+(fa().length?`<button class="link" onclick="go('fav')">⚖️ Сравнить (${fa().length})</button>`:'')+'<div style="height:12px"></div>'+disclaimer}
else if(S.v==='cards'){const kw=KW(),p=P[S.p],total0=curO().filter(o=>o[0]===S.p).length;
if(!total0){h=hdr('prof')+`<div class="bar"><b style="color:var(--tx);font-size:16px">${p.e} ${p.n}</b></div><div class="empty">Пока нет ${kw.plOf} по этой профессии в нашей базе.<br>Попробуйте другую профессию или вернитесь позже.</div><button class="btn" onclick="go('prof')">← Выбрать другую профессию</button>`}
else{const q=queue();h=hdr('prof')+`<div class="bar"><b style="color:var(--tx);font-size:16px">${p.e} ${p.n}</b><label><input type="checkbox" ${S.all?'':'checked'} onchange="S.all=!this.checked;render()"> только где проходят мои баллы</label></div><div class="stack">${q.length?(q[1]?card(q[1][0],q[1][1],1):'')+card(q[0][0],q[0][1],0):`<div class="empty">🎉 Больше карточек нет: понравившиеся уже в сравнении.<br>Нажмите «Вернуть», чтобы пересмотреть, или выберите другую профессию.</div>`}</div><div class="act"><button class="u" onclick="undo()" ${S.sw.length?'':'disabled'}>↩ Вернуть</button><button class="n" onclick="fly(false)" aria-label="Нет">✕</button><button class="y" onclick="fly(true)" aria-label="Да">♥</button></div>${fa().length?`<div class="nx2"><button class="btn" onclick="go('fav')">⚖️ Сравнить выбранные (${fa().length})</button><button class="btn alt" onclick="go('prof')">← К другим профессиям</button></div>`:''}<p class="sub" style="font-size:12px;margin:8px 0 0;text-align:center">Свайп вправо: нравится. Влево: пропустить.</p>`}}
else{h=favView()}
$.classList.toggle('na',!!S.na);S.na=0;$.innerHTML=h+extra();wireCols();const t=document.querySelector('.card:not(.nx)');if(t)bind(t)}
function favView(){const isUni=S.kind==='uni',curS=curScore();
const R=fa().map(i=>{const o=curO()[i],c=curC()[o[1]];return{i,o,c,p:P[o[0]],pr:o[3]?0:o[4],sc:scoreVal(o),tm:tmin(c),q:c[4]}});
let h=hdr('prof')+`<h1>⚖️ Сравнение</h1><p class="sub">Выбрано: ${R.length}. Нажмите «Подробнее», чтобы прочитать больше.</p>`;
if(!R.length)return h+`<div class="empty">Пока пусто. Нажимайте ♥ на карточках.</div><button class="btn" onclick="go('prof')">Выбрать профессию</button>`;
let G=R,many=R.length>1;const mn=k=>Math.min(...G.map(r=>r[k])),mx=k=>Math.max(...G.map(r=>r[k]));
const scLabel=isUni?'Балл ЕГЭ*':'Средний балл*',scFmt=v=>isUni?fi(v):f(v);
const bar=(l,v,b,pc)=>`<div class="mt"><div class="ml"><span>${l}</span><b class="${b?'bs':''}">${v}</b></div><div class="bt"><i class="${b?'bs':''}" style="width:${Math.max(6,pc)}%"></i></div></div>`;
const cardOf=(r,k)=>{const bp=r.pr===mn('pr'),bs=r.sc===mn('sc'),bt=r.tm===mn('tm'),bq=r.q===mx('q');
const tg=[[r.rk===0&&(S.sort||'best')==='best','Лучший для вас','🏆'],[bp,r.pr?'Лучшая цена':'Бесплатно','💸'],[bt,'Ближе всего к дому','📍'],[bq,'Лучшая оценка','⭐'],[bs,'Проще по баллам','🎯']].filter(a=>a[0]&&many);
const why=tg.length?'Из выбранных вариантов здесь: '+tg.map(a=>a[1].toLowerCase()).join(', ')+'.':many?'Сбалансированный вариант: нет явных рекордов, но и слабых мест тоже.':'Пока это единственный выбранный вариант, добавьте ещё, чтобы сравнить.';
const prog=r.o[3]?(isUni?'бюджетное: места распределяются по результатам ЕГЭ, в прошлом году проходной балл был '+fi(r.sc)+' из '+(S.examN*100)+'.':'бюджетное: места распределяются по среднему баллу аттестата, в прошлом году проходной балл был '+f(r.sc)+'.'):(isUni?'платное: '+r.o[4].toLocaleString('ru-RU')+' ₽ в год, минимальный балл ЕГЭ для зачисления '+fi(r.sc)+'.':'платное: '+r.o[4].toLocaleString('ru-RU')+' ₽ в год, минимальный балл для зачисления '+f(r.sc)+'.');
const prac=isUni?'Учебный план сочетает лекции и практику: со старших курсов студенты проходят стажировки у партнёрских организаций. Выпускникам помогают с трудоустройством и поступлением в магистратуру.':'Учебный план сочетает теорию и практику: с первого года студенты работают в мастерских и лабораториях, на старших курсах проходят стажировку у партнёров колледжа. Выпускникам помогают с трудоустройством и поступлением в вузы.';
const txt=`<h4>О ${isUni?'вузе':'колледже'}</h4><p>${r.c[0]}. ${r.c[5]} Расположен у метро «${r.c[1]}», дорога от района «${S.home}» занимает около ${r.tm} минут.</p><h4>Программа «${r.p.n}»</h4><p>Обучение ${prog} ${prac}</p><h4>Чем отличается</h4><p>${why} Оценка качества образования: ${f(r.q)} из 5.</p><h4>Документы и сроки</h4><p>Аттестат, паспорт, фотографии 3×4 и заявление.${r.o[5]?' '+r.o[5]+'.':''} Приём документов обычно идёт с июня по август.</p><p class="src">Точные условия приёма уточняйте на сайте ${isUni?'университета':'колледжа'}.</p>`;
return `<div class="cc" style="animation-delay:${k*110}ms"><div class="ch2" style="background:linear-gradient(135deg,${r.p.g})"><span class="em">${r.p.e}</span><div><b>${r.c[0]}</b><small>${r.p.n} · м. ${r.c[1]}${many?' · совпадение '+Math.round(r.tot*100)+'%':''}</small></div><button class="x w" onclick="delCard(${r.i},this)" aria-label="Убрать">✕</button></div><div class="tgs">${tg.map(a=>`<span>${a[2]} ${a[1]}</span>`).join('')}</div><div class="ms">${bar('Цена в год',r.o[3]?'бесплатно':r.pr.toLocaleString('ru-RU')+' ₽',bp&&many,r.pr/(mx('pr')||1)*100)}${bar(scLabel,scFmt(r.sc),bs&&many,r.sc/(mx('sc')||1)*100)}${bar('В пути от «'+S.home+'»',r.tm+' мин',bt&&many,r.tm/mx('tm')*100)}${bar('Качество образования','⭐ '+f(r.q),bq&&many,r.q/5*100)}</div><button class="mo" onclick="this.closest('.cc').classList.toggle('op')">Подробнее <span>⌄</span></button><div class="more"><div class="mi">${txt}</div></div></div>`};
const ps=[...new Set(R.map(r=>r.o[0]))],tab=ps.includes(S.tab)?S.tab:ps[0];
const grp=p=>{G=R.filter(r=>r.o[0]===p);many=G.length>1;const nz=(k,hi)=>r=>{const a=mn(k),b=mx(k);return a===b?1:hi?(r[k]-a)/(b-a):(b-r[k])/(b-a)};const fp=nz('pr'),ft=nz('tm'),fq=nz('q',1);const fitDiv=isUni?80:0.5;G.forEach(r=>{const fit=curS>=r.sc?1:Math.max(0,1-(r.sc-curS)/fitDiv);r.tot=(fp(r)+ft(r)+fq(r)+fit*1.5)/4.5});const cmp={best:(a,b)=>b.tot-a.tot,pr:(a,b)=>a.pr-b.pr,tm:(a,b)=>a.tm-b.tm,q:(a,b)=>b.q-a.q,sc:(a,b)=>a.sc-b.sc}[S.sort||'best'];G.sort(cmp);G.forEach((r,j)=>{r.rk=j});return G.map(cardOf).join('')};
h+=`<div class="srt"><span>Сортировка:</span><select class="sel" onchange="S.sort=this.value;render()">${[['best','🏆 Лучший вариант для вас'],['pr','💸 Сначала дешёвые'],['tm','📍 Сначала ближайшие'],['q','⭐ По качеству образования'],['sc','🎯 Проще по баллам']].map(a=>`<option value="${a[0]}"${(S.sort||'best')===a[0]?' selected':''}>${a[1]}</option>`).join('')}</select></div><div class="nav"><button class="ar" onclick="stepCol(-1)" aria-label="Назад">‹</button><div class="chips st">${ps.map((p,j)=>`<button class="chip ${p===tab?'on':''}" onclick="setTab(${p})">${P[p].e} ${P[p].n} · ${R.filter(r=>r.o[0]===p).length}</button>`).join('')}</div><button class="ar" onclick="stepCol(1)" aria-label="Вперёд">›</button></div>`;
if(tab==='all'){h+=`<div class="cols">${ps.map(p=>`<section class="col" id="col${p}"><div class="colh" style="background:linear-gradient(135deg,${P[p].g})"><span>${P[p].e} ${P[p].n}</span><small>${R.filter(r=>r.o[0]===p).length}</small></div>${grp(p)}</section>`).join('')}</div>`}else h+=`<div id="lst">${grp(tab)}</div>`;
return h+`<button class="btn" onclick="go('prof')">← Выбрать другую профессию</button><button class="btn alt" onclick="reset();render()">Начать заново</button><div style="height:14px"></div>`+disclaimer}
function extra(){if(S.v==='score'||S.v==='fav'||!fa().length)return '';return `<button class="fab" onclick="go('fav')">⚖️ Сравнение · ${fa().length}</button>`}
window.goCol=function(p){const e=document.getElementById('col'+p);if(e)e.parentElement.scrollTo({left:e.offsetLeft-(e.parentElement.clientWidth-e.offsetWidth)/2,behavior:'smooth'})}
function wireCols(){const a0=document.querySelector('.chip.on');if(a0){const s=a0.parentElement;s.scrollLeft=a0.offsetLeft-s.clientWidth/2+a0.offsetWidth/2}const c=document.querySelector('.cols');if(!c)return;const upd=()=>{const mid=c.scrollLeft+c.clientWidth/2;let best=0,bd=1e9;[...c.children].forEach((e,i)=>{const d=Math.abs(e.offsetLeft+e.offsetWidth/2-mid);if(d<bd){bd=d;best=i}});const bs=document.querySelectorAll('.chip');bs.forEach((b,i)=>b.classList.toggle('on',i===best));const a=bs[best];if(a&&a.parentElement.scrollWidth>a.parentElement.clientWidth)a.parentElement.scrollTo({left:a.offsetLeft-20,behavior:'smooth'})};c.addEventListener('scroll',upd);upd()}
window.stepCol=function(d){const bs=[...document.querySelectorAll('.chip')],i=bs.findIndex(b=>b.classList.contains('on')),t=bs[Math.max(0,Math.min(bs.length-1,i+d))];if(t&&t!==bs[i])t.click();};
window.delCard=function(i,b){const c=b.closest('.cc');if(c.classList.contains('out'))return;setFa(fa().filter(x=>x!==i));c.style.height=c.offsetHeight+'px';c.classList.add('out');setTimeout(()=>{c.classList.add('gone');if(document.querySelector('.cc.out:not(.gone)'))return;const sy=scrollY;S.na=1;render();scrollTo(0,sy)},400)};
render();
</script></body></html>
