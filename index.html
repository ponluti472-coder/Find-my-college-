function queue(){return O.map((o,i)=>[o,i]).filter(([o,i])=>o[0]===S.p&&!S.sw.some(s=>s.i===i)&&!S.fav.includes(i)&&(S.all||reach(o))).sort((a,b)=>{const ra=reach(a[0]),rb=reach(b[0]);if(ra!==rb)return ra?-1:1;if(ra)return b[0][3]-a[0][3]||b[0][2]-a[0][2];return a[0][2]-b[0][2]})}
const PI=[['Пишет программы, сайты и приложения, исправляет ошибки и придумывает, как всё это будет работать. Работает за компьютером, часто в команде, может удалённо.','Подойдёт, если вам интересно разбираться в технике, нравится логика и не страшно долго сидеть за ПК.','Колледж даёт базу, дальше многое — самообучение и свои проекты.'],['Помогает врачу, ухаживает за больными, делает уколы и перевязки, следит за состоянием пациентов.','Подойдёт, если вас вдохновляет помогать людям и вы спокойны в стрессовых ситуациях. Работа всегда нужна.','Сменный график, большая ответственность, нужна медсправка при поступлении.'],['Рисует интерфейсы, логотипы, постеры и интерьеры: превращает идею заказчика в красивую и понятную картинку.','Подойдёт, если вы замечаете детали, есть вкус и хочется делать вещи, которые видит много людей.','Часто нужны портфолио и вступительное испытание по рисунку.'],['Готовит блюда и выпечку, следит за качеством продуктов и чистотой на кухне, работает в ресторанах, кафе, на производстве.','Подойдёт, если нравится создавать что-то руками и видеть результат сразу.','Работа на ногах, жара и темп, график часто сменный.'],['Монтирует и чинит проводку, щитки, освещение и оборудование, находит неисправности.','Подойдёт, если вы аккуратны, любите разбираться, как устроены устройства, и цените понятный результат.','Важны техника безопасности и внимательность: ошибка может быть опасной.'],['Ведёт учёт денег компании, счета, налоги и отчёты, часто в программе 1С.','Подойдёт, если вы усидчивы, любите порядок и цифры, боитесь сложных таблиц меньше, чем хаоса.','Нужно следить за изменениями в налогах и законах, очень важна точность.'],['Диагностирует и ремонтирует машины: двигатель, подвеску, электрику, тормоза.','Подойдёт, если вам нравится техника и вы хотите работать руками и головой одновременно.','Работа физическая, масло и грязь — часть профессии; зато навык всегда нужен.'],['Организует поездки, бронирует отели, встречает гостей, консультирует и решает их проблемы.','Подойдёт, если вам легко даётся общение, интересны языки и путешествия.','Много общения с людьми, иногда стресс и неровный график; английский очень пригодится.']];
function info(){if(S.pv===undefined)return '';const p=P[S.pv],t=PI[S.pv],n=O.filter((o,k)=>o[0]===S.pv&&reach(o)&&!S.fav.includes(k)).length;return `<div id="pinfo" class="pi"><h3>${p.e} ${p.n}</h3><h4>Что делает</h4><p>${t[0]}</p><h4>Почему может подойти</h4><p>${t[1]}</p><h4>Что важно знать</h4><p>${t[2]}</p><button class="btn" onclick="pick(${S.pv})">Смотреть колледжи${n?' · '+n:''}</button></div>`}
function selP(i){S.pv=i;render();const e=document.getElementById('pinfo');if(e)e.scrollIntoView({behavior:'smooth',block:'nearest'})}
function setTab(p){S.tab=p;render()}
function hdr(back){const st={score:1,prof:2,cards:3,fav:3}[S.v];return `<div class="top">${back?`<button class="back" onclick="go('${back}')" aria-label="Назад">←</button>`:''}<div class="dots">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div></div>`}
const demo='<div class="demo">Демо-версия: названия колледжей и цифры придуманы для показа. Не используйте для реального выбора. Баллы указаны за прошлый год и меняются.</div>';
function go(v){S.v=v;render();scrollTo(0,0)}
function parse(s){const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?null:n}
function chk(v){const n=parse(v),ok=n!==null&&n>=3&&n<=5;S.score=ok?Math.round(n*100)/100:null;document.getElementById('go').disabled=!ok;document.getElementById('hint').className='hint'+(v&&!ok?' err':'');document.getElementById('hint').textContent=v&&!ok?'Введите число от 3,00 до 5,00':'Как в аттестате, например 4,37'}
function pick(p){S.p=p;S.sw=[];go('cards')}
function fly(l){const c=document.querySelector('.card:not(.nx)');if(!c)return;c.style.transform=`translateX(${l?520:-520}px) rotate(${l?20:-20}deg)`;c.style.opacity=0;setTimeout(()=>act(l),200)}
function act(l){const q=queue();if(!q.length)return;const i=q[0][1];S.sw.push({i,l});if(l&&!S.fav.includes(i))S.fav.push(i);render()}
function undo(){const s=S.sw.pop();if(!s)return;if(s.l)S.fav=S.fav.filter(x=>x!==s.i);render()}
function del(i){S.fav=S.fav.filter(x=>x!==i);render()}
function card(o,i,nx){const p=P[o[0]],c=C[o[1]],d=S.score-o[2],cl=d>=.15?['ok','Высокие шансы']:d>=0?['mid','Шансы средние']:['no','Не хватает '+f(-d)];
return `<div class="card${nx?' nx':''}" data-i="${i}"><div class="hd" style="background:linear-gradient(135deg,${p.g})">${p.e}<span class="tg a">${o[3]?'БЮДЖЕТ':'ПЛАТНОЕ'}</span><span class="tg b">ДЕМО</span></div><div class="bd"><h3>${c[0]}</h3><p>${p.s}</p><p>🚇 м. ${c[1]}</p><p class="ds">${c[5]}</p><div class="st"><div><small>${o[3]?'Проходной балл*':'Мин. балл*'}</small><b>${f(o[2])}</b></div><div><small>Цена в год</small><b>${o[3]?'бесплатно':o[4].toLocaleString('ru-RU')+' ₽'}</b></div><div><small>Качество образования</small><b>⭐ ${f(c[4])}</b></div><div><small>В пути от: ${S.home}</small><b>~${tmin(c)} мин</b></div></div><span class="ch ${cl[0]}">${cl[1]}</span>${o[5]?`<div class="fl">${o[5]}</div>`:''}<p style="font-size:11px">* прошлый год</p></div></div>`}
function bind(el){let sx=0,dx=0,dr=false;
el.addEventListener('pointerdown',e=>{dr=true;sx=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'});
el.addEventListener('pointermove',e=>{if(!dr)return;dx=e.clientX-sx;el.style.transform=`translateX(${dx}px) rotate(${dx*.05}deg)`;el.classList.toggle('l',dx>40);el.classList.toggle('r',dx<-40)});
el.addEventListener('pointerup',()=>{if(!dr)return;dr=false;el.style.transition='';if(Math.abs(dx)>110)fly(dx>0);else{el.style.transform='';el.classList.remove('l','r')}dx=0})}
function render(){let h='';
if(S.v==='score'){h=hdr()+`<h1>Куда поступить после 9 класса?</h1><p class="sub">Введите средний балл аттестата и выберите профессию. Покажем колледжи Петербурга, куда вы проходите.</p><div class="sb"><label for="sc">Ваш средний балл</label><input id="sc" inputmode="decimal" placeholder="4,37" autocomplete="off" value="${S.score!==null?f(S.score):''}" oninput="chk(this.value)" onkeydown="if(event.key==='Enter'&&S.score!==null)go('prof')"><div id="hint" class="hint">Как в аттестате, например 4,37</div><label for="hm" style="display:block;margin-top:14px;font-size:13px;color:var(--mu)">Где вы живёте</label><select id="hm" class="sel" onchange="S.home=this.value">${Object.keys(H).map(k=>`<option${k===S.home?' selected':''}>${k}</option>`).join('')}</select></div><button id="go" class="btn" ${S.score===null?'disabled':''} onclick="go('prof')">Выбрать профессию</button><div style="height:14px"></div>`+demo}
else if(S.v==='prof'){h=hdr('score')+`<h1>Кем хотите стать?</h1><p class="sub">Ваш балл: <b>${f(S.score)}</b>. Выберите профессию, чтобы увидеть колледжи.</p><div class="grid">${P.map((p,i)=>{const n=O.filter((o,k)=>o[0]===i&&reach(o)&&!S.fav.includes(k)).length;return `<button class="pc" style="background:linear-gradient(135deg,${p.g})" onclick="selP(${i})"><div class="e">${p.e}</div><b>${p.n}</b><span>${p.d}</span><em>${n?'Подходит: '+n:O.some(o=>o[0]===i&&reach(o))?'✓ Всё добавлено':'Выше вашего балла'}</em></button>`}).join('')}</div>`+info()+(S.fav.length?`<button class="link" onclick="go('fav')">⚖️ Сравнить (${S.fav.length})</button>`:'')+'<div style="height:12px"></div>'+demo}
else if(S.v==='cards'){const q=queue(),p=P[S.p];h=hdr('prof')+`<div class="bar"><b style="color:var(--tx);font-size:16px">${p.e} ${p.n}</b><label><input type="checkbox" ${S.all?'checked':''} onchange="S.all=this.checked;render()"> и выше моего балла</label></div><div class="stack">${q.length?(q[1]?card(q[1][0],q[1][1],1):'')+card(q[0][0],q[0][1],0):`<div class="empty">🎉 Вы просмотрели всё, что подходит: понравившиеся уже в сравнении.<br>Включите «и выше моего балла» или выберите другую профессию.</div>`}</div><div class="act"><button class="u" onclick="undo()" aria-label="Вернуть">↩</button><button class="n" onclick="fly(false)" aria-label="Нет">✕</button><button class="y" onclick="fly(true)" aria-label="Да">♥</button></div>${S.fav.length?`<div class="nx2"><button class="btn" onclick="go('fav')">⚖️ Сравнить выбранные (${S.fav.length})</button><button class="btn alt" onclick="go('prof')">← К другим профессиям</button></div>`:''}<p class="sub" style="font-size:12px;margin:8px 0 0;text-align:center">Свайп вправо: нравится. Влево: пропустить.</p>`}
else{h=favView();if(0)h=hdr('prof')+`<h1>Мои варианты</h1><p class="sub">Сравните колледжи рядом друг с другом.</p>`+(S.fav.length?S.fav.map(i=>{const o=O[i],c=C[o[1]];return `<div class="row"><div><b>${c[0]}</b><br>${P[o[0]].s}<br>${o[3]?'Бюджет':'Платное: '+o[4].toLocaleString('ru-RU')+' ₽/год'} · балл ${f(o[2])}* · ${c[1]}</div><button class="x" onclick="del(${i})" aria-label="Убрать">✕</button></div>`}).join(''):'<div class="empty">Пока пусто. Нажимайте ♥ на карточках.</div>')+`<button class="btn alt" onclick="go('prof')">Другая профессия</button><button class="btn alt" onclick="reset();render()">Начать заново</button><div style="height:14px"></div>`+demo}
function favView(){const R=S.fav.map(i=>{const o=O[i],c=C[o[1]];return{i,o,c,p:P[o[0]],pr:o[3]?0:o[4],sc:o[2],tm:tmin(c),q:c[4]}});
let h=hdr('prof')+`<h1>⚖️ Сравнение</h1><p class="sub">Выбрано: ${R.length}. Нажмите «Подробнее» у колледжа, чтобы прочитать о нём больше.</p>`;
if(!R.length)return h+`<div class="empty">Пока пусто. Нажимайте ♥ на карточках.</div><button class="btn" onclick="go('prof')">Выбрать профессию</button>`;
let G=R,many=R.length>1;const mn=k=>Math.min(...G.map(r=>r[k])),mx=k=>Math.max(...G.map(r=>r[k]));
const bar=(l,v,b,pc)=>`<div class="mt"><div class="ml"><span>${l}</span><b class="${b?'bs':''}">${v}</b></div><div class="bt"><i class="${b?'bs':''}" style="width:${Math.max(6,pc)}%"></i></div></div>`;
const cardOf=(r,k)=>{const bp=r.pr===mn('pr'),bs=r.sc===mn('sc'),bt=r.tm===mn('tm'),bq=r.q===mx('q');
const tg=[[bp,r.pr?'Лучшая цена':'Бесплатно','💸'],[bt,'Ближе всего к дому','📍'],[bq,'Лучшая оценка','⭐'],[bs,'Проще по баллу','🎯']].filter(a=>a[0]&&many);
const why=tg.length?'Среди ваших вариантов у этого колледжа: '+tg.map(a=>a[1].toLowerCase()).join(', ')+'.':many?'Сбалансированный вариант: нет явных рекордов, но и слабых мест тоже.':'Пока это единственный выбранный колледж, добавьте ещё, чтобы сравнить.';
const txt=`<h4>О колледже</h4><p>${r.c[0]}. ${r.c[5]} Расположен у метро «${r.c[1]}», дорога от района «${S.home}» занимает около ${r.tm} минут.</p><h4>Программа «${r.p.n}»</h4><p>Обучение ${r.o[3]?'бюджетное: места распределяются по среднему баллу аттестата, в прошлом году проходной балл был '+f(r.sc)+'.':'платное: '+r.o[4].toLocaleString('ru-RU')+' ₽ в год, минимальный балл для зачисления '+f(r.sc)+'.'} Учебный план сочетает теорию и практику: с первого года студенты работают в мастерских и лабораториях, на старших курсах проходят стажировку у партнёров колледжа. Выпускникам помогают с трудоустройством и поступлением в вузы.</p><h4>Чем отличается</h4><p>${why} Оценка качества образования: ${f(r.q)} из 5.</p><h4>Документы и сроки</h4><p>Аттестат, паспорт, фотографии 3×4 и заявление.${r.o[5]?' '+r.o[5]+'.':''} Приём документов обычно идёт с июня по август.</p><p class="src">📄 Образец текста «с официального сайта» college${r.o[1]+1}.example.ru. Всё придумано для демо.</p>`;
return `<div class="cc" style="animation-delay:${k*110}ms"><div class="ch2" style="background:linear-gradient(135deg,${r.p.g})"><span class="em">${r.p.e}</span><div><b>${r.c[0]}</b><small>${r.p.n} · м. ${r.c[1]}</small></div><button class="x w" onclick="delCard(${r.i},this)" aria-label="Убрать">✕</button></div><div class="tgs">${tg.map(a=>`<span>${a[2]} ${a[1]}</span>`).join('')}</div><div class="ms">${bar('Цена в год',r.o[3]?'бесплатно':r.pr.toLocaleString('ru-RU')+' ₽',bp&&many,r.pr/(mx('pr')||1)*100)}${bar('Проходной балл*',f(r.sc),bs&&many,(r.sc-3)/2*100)}${bar('В пути от «'+S.home+'»',r.tm+' мин',bt&&many,r.tm/mx('tm')*100)}${bar('Качество образования','⭐ '+f(r.q),bq&&many,r.q/5*100)}</div><button class="mo" onclick="this.closest('.cc').classList.toggle('op')">Подробнее <span>⌄</span></button><div class="more"><div class="mi">${txt}</div></div></div>`};
const ps=[...new Set(R.map(r=>r.o[0]))],tab=ps.includes(S.tab)?S.tab:ps[0];
const grp=p=>{G=R.filter(r=>r.o[0]===p);many=G.length>1;return G.map(cardOf).join('')};
h+=`<div class="nav"><button class="ar" onclick="stepCol(-1)" aria-label="Назад">‹</button><div class="chips st">${ps.map((p,j)=>`<button class="chip ${p===tab?'on':''}" onclick="setTab(${p})">${P[p].e} ${P[p].n} · ${R.filter(r=>r.o[0]===p).length}</button>`).join('')}</div><button class="ar" onclick="stepCol(1)" aria-label="Вперёд">›</button></div>`;
if(tab==='all'){h+=`<div class="cols">${ps.map(p=>`<section class="col" id="col${p}"><div class="colh" style="background:linear-gradient(135deg,${P[p].g})"><span>${P[p].e} ${P[p].n}</span><small>${R.filter(r=>r.o[0]===p).length}</small></div>${grp(p)}</section>`).join('')}</div>`}else h+=`<div id="lst">${grp(tab)}</div>`;
return h+`<button class="btn" onclick="go('prof')">← Выбрать другую профессию</button><button class="btn alt" onclick="reset();render()">Начать заново</button><div style="height:14px"></div>`+demo}
function extra(){if(S.v==='score'||S.v==='fav'||!S.fav.length)return '';return `<button class="fab" onclick="go('fav')">⚖️ Сравнение · ${S.fav.length}</button>`}
function extraOld(){if(S.v==='score'||!S.fav.length){S.sheet=false;return ''}
const s=`<button class="fab" onclick="S.sheet=true;render()">⚖️ Сравнение · ${S.fav.length}</button>`;if(!S.sheet)return s;
const R=S.fav.map(i=>{const o=O[i],c=C[o[1]];return{i,n:c[0],pr:o[3]?0:o[4],sc:o[2],tm:tmin(c),q:c[4],b:o[3]}});
const mn=k=>Math.min(...R.map(r=>r[k])),mx=Math.max(...R.map(r=>r.q)),cl=(r,k,v)=>r[k]===v?' class="b"':'';
return s+`<div class="ov" onclick="S.sheet=false;render()"><div class="sh" onclick="event.stopPropagation()"><h2>Сравнение выбранных <button class="x" onclick="S.sheet=false;render()">✕</button></h2><table class="tb"><tr><th>Колледж</th><th>Цена/год</th><th>Балл*</th><th>В пути</th><th>Оценка</th><th></th></tr>${R.map(r=>`<tr><td>${r.n}</td><td${cl(r,'pr',mn('pr'))}>${r.b?'бесплатно':r.pr.toLocaleString('ru-RU')+' ₽'}</td><td${cl(r,'sc',mn('sc'))}>${f(r.sc)}</td><td${cl(r,'tm',mn('tm'))}>${r.tm} мин</td><td${cl(r,'q',mx)}>⭐ ${f(r.q)}</td><td><button class="x" onclick="del(${r.i})">✕</button></td></tr>`).join('')}</table><p class="hint" style="margin-top:10px">Зелёным отмечено лучшее: дешевле, легче по баллу, ближе от «${S.home}», выше оценка. Время в пути и оценки демо.</p></div></div>`}
window.goCol=function(p){const e=document.getElementById('col'+p);if(e)e.parentElement.scrollTo({left:e.offsetLeft-(e.parentElement.clientWidth-e.offsetWidth)/2,behavior:'smooth'})}
function wireCols(){const a0=document.querySelector('.chip.on');if(a0){const s=a0.parentElement;s.scrollLeft=a0.offsetLeft-s.clientWidth/2+a0.offsetWidth/2}const c=document.querySelector('.cols');if(!c)return;const upd=()=>{const mid=c.scrollLeft+c.clientWidth/2;let best=0,bd=1e9;[...c.children].forEach((e,i)=>{const d=Math.abs(e.offsetLeft+e.offsetWidth/2-mid);if(d<bd){bd=d;best=i}});const bs=document.querySelectorAll('.chip');bs.forEach((b,i)=>b.classList.toggle('on',i===best));const a=bs[best];if(a&&a.parentElement.scrollWidth>a.parentElement.clientWidth)a.parentElement.scrollTo({left:a.offsetLeft-20,behavior:'smooth'})};c.addEventListener('scroll',upd);upd()}
window.stepCol=function(d){const bs=[...document.querySelectorAll('.chip')],i=bs.findIndex(b=>b.classList.contains('on')),t=bs[Math.max(0,Math.min(bs.length-1,i+d))];if(t&&t!==bs[i])t.click();};
window.delCard=function(i,b){const c=b.closest('.cc');if(c.classList.contains('out'))return;S.fav=S.fav.filter(x=>x!==i);c.style.height=c.offsetHeight+'px';c.classList.add('out');setTimeout(()=>{c.classList.add('gone');if(document.querySelector('.cc.out:not(.gone)'))return;const sy=scrollY;S.na=1;render();scrollTo(0,sy)},400)};
window.delCard0=function(i,b){const c=b.closest('.cc'),cl=document.querySelector('.cols'),sx=cl?cl.scrollLeft:0,sy=scrollY;c.style.height=c.offsetHeight+'px';c.classList.add('out');setTimeout(()=>{S.fav=S.fav.filter(x=>x!==i);S.na=1;render();const n=document.querySelector('.cols');if(n){n.style.scrollBehavior='auto';n.scrollLeft=sx}scrollTo(0,sy)},560)}
$.classList.toggle('na',!!S.na);S.na=0;$.innerHTML=h+extra();wireCols();const t=document.querySelector('.card:not(.nx)');if(t)bind(t)}
render();
</script></body></html>
